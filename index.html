  :root{
    --bg:#f4ece0; --card:#fffaf2; --ink:#4a3b25; --muted:#8a7a60;
    --gold:#b8862f; --gold-strong:#9c6f22; --line:#e4d8c4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1812; --card:#2a2318; --ink:#f0e6d4; --muted:#bdae92; --line:#4a3f2c;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    line-height:1.5; padding:16px; display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:560px}
  h1{font-size:1.25rem; text-align:center; margin:.4rem 0 .2rem; color:var(--gold-strong)}
  .sub{text-align:center; color:var(--muted); font-size:.9rem; margin:0 0 1rem}
  .field{margin-bottom:.75rem}
  label{display:block; font-size:.9rem; font-weight:600; margin-bottom:.35rem}
  input[type=text]{
    width:100%; padding:.7rem .8rem; font-size:1.05rem; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold)}
  .preview{
    width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:8px; margin:.6rem 0; box-shadow:0 4px 18px rgba(0,0,0,.08);
  }
  canvas{display:block; width:100%; height:auto; border-radius:6px}
  .row{display:flex; gap:.5rem; flex-wrap:wrap; align-items:center}
  .sizectl{display:flex; align-items:center; gap:.4rem; color:var(--muted); font-size:.85rem; margin-bottom:.6rem}
  button{
    font:inherit; cursor:pointer; border:none; border-radius:10px; padding:.55rem .9rem;
  }
  .btn-main{
    flex:1; min-width:200px; background:linear-gradient(180deg,#d4a63e,#b8862f);
    color:#fff; font-weight:700; font-size:1.05rem; padding:.85rem 1rem;
    box-shadow:0 3px 10px rgba(184,134,47,.35);
  }
  .btn-main:active{transform:translateY(1px)}
  .btn-ghost{
    background:var(--card); color:var(--ink); border:1px solid var(--line);
    width:40px; height:40px; font-size:1.2rem; line-height:1; font-weight:700;
  }
  .note{font-size:.82rem; color:var(--muted); margin-top:.8rem; text-align:center}
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#333; color:#fff; padding:.7rem 1.1rem; border-radius:999px; font-size:.9rem;
    opacity:0; transition:.3s; pointer-events:none; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .warn{color:#b4521f}
</style>
</head>
<body>
  <div class="wrap">
    <h1>💌 Tạo thiệp mời cá nhân</h1>
    <p class="sub">Nhập tên của bạn, thiệp sẽ hiện tên rồi bấm tải về để lưu/gửi.</p>

    <div class="field">
      <label for="name">Tên khách mời</label>
      <input id="name" type="text" placeholder="Ví dụ: Gia đình Anh" autocomplete="off" maxlength="60">
    </div>

    <div class="sizectl">
      <span>Cỡ chữ:</span>
      <button class="btn-ghost" id="minus" title="Nhỏ hơn" aria-label="Giảm cỡ chữ">–</button>
      <button class="btn-ghost" id="plus" title="Lớn hơn" aria-label="Tăng cỡ chữ">+</button>
    </div>

    <div class="preview">
      <canvas id="cv" width="1013" height="1580"></canvas>
    </div>

    <div class="row">
      <button class="btn-main" id="save">⬇️ Lưu &amp; Tải thiệp (PNG)</button>
    </div>

    <p class="note" id="status"></p>
    <p class="note">📱 <b>iPhone:</b> sau khi bấm nút trên, chọn <b>"Lưu ảnh" / "Lưu vào Ảnh"</b> (nếu hiện bảng chia sẻ), hoặc <b>nhấn giữ vào ảnh</b> rồi chọn <b>"Lưu ảnh"</b>. Nên mở bằng <b>Safari</b> hoặc Chrome.</p>
  </div>

  <div class="toast" id="toast"></div>

  // Nạp ảnh qua Blob URL thay vì data:URI khổng lồ — ổn định hơn với ảnh lớn.
  try {
    const _bin = atob(IMG_B64);
    const _bytes = new Uint8Array(_bin.length);
    for (let i = 0; i < _bin.length; i++) _bytes[i] = _bin.charCodeAt(i);
    bg.src = URL.createObjectURL(new Blob([_bytes], { type: 'image/jpeg' }));
  } catch (e) {
    bg.src = 'data:image/jpeg;base64,' + IMG_B64;
  }

  // Chờ font nạp xong rồi vẽ lại để canvas dùng đúng kiểu chữ (không bị fallback).
  // Trình duyệt không hỗ trợ Font Loading API vẫn chạy được: draw() tự chạy khi ảnh nền tải xong.
  if (document.fonts && document.fonts.ready) {
    Promise.resolve(document.fonts.load('700 62px "Dancing Script"', 'Gia đình Anh'))
      .catch(()=>{})
      .then(() => document.fonts.ready)
      .then(() => draw());
  }

  function currentName(){ return input.value.replace(/\s+/g,' ').trim(); }

  function fitFont(name){
    let size = baseSize + sizeAdj;
    if (size < NAME_MIN_SIZE) size = NAME_MIN_SIZE;
    ctx.font = `700 ${size}px "Dancing Script", cursive`;
    while (ctx.measureText(name).width > NAME_MAX_W && size > NAME_MIN_SIZE){
      size -= 1;
      ctx.font = `700 ${size}px "Dancing Script", cursive`;
    }
    return size;
  }

  function draw(){
    if (!bgReady) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

    const name = currentName();
    if (!name) return;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    fitFont(name);              // chọn cỡ chữ lớn nhất còn vừa khung (đặt ctx.font)
    ctx.fillStyle = NAME_COLOR;

    // Nếu đã nhỏ hết cỡ mà vẫn dài quá khung -> nén ngang để luôn vừa, không bị cắt.
    const w = ctx.measureText(name).width;
    if (w > NAME_MAX_W) {
      const scaleX = NAME_MAX_W / w;
      ctx.save();
      ctx.translate(NAME_CENTER_X, NAME_CENTER_Y);
      ctx.scale(scaleX, 1);
      ctx.fillText(name, 0, 0);
      ctx.restore();
    } else {
      ctx.fillText(name, NAME_CENTER_X, NAME_CENTER_Y);
    }
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2600);
  }

  async function sendToSheet(name){
    if (!SHEET_WEBAPP_URL) return 'skip';
    // Dùng mode:'no-cors' nên KHÔNG đọc được phản hồi của máy chủ:
    // 'sent' chỉ nghĩa là đã gửi đi (không xác nhận được ghi thành công hay chưa).
    try{
      await fetch(SHEET_WEBAPP_URL, {
        method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ name: name })
      });
      return 'sent';
    }catch(e){ return 'fail'; }
  }

  function makeFilename(name){
    const safe = name ? '-' + name.replace(/[^\p{L}\p{N}]+/gu,'_') : '';
    return 'thiep-moi' + safe + '.png';
  }

  // Tạo Blob PNG ĐỒNG BỘ (không await) để giữ "thao tác chạm" cho navigator.share trên iPhone.
  function canvasToBlob(){
    try {
      const b = atob(canvas.toDataURL('image/png').split(',')[1]);
      const arr = new Uint8Array(b.length);
      for (let i=0;i<b.length;i++) arr[i]=b.charCodeAt(i);
      return new Blob([arr], {type:'image/png'});
    } catch(e){ return null; }
  }

  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // Lưu ảnh: iPhone dùng chia sẻ (lưu vào Ảnh) hoặc mở ảnh để nhấn giữ; máy tính/Android tải thẳng.
  async function saveImage(name){
    draw();
    const blob = canvasToBlob();
    if (!blob) return 'fail';
    const filename = makeFilename(name);

    // 1) Web Share kèm file — tốt nhất cho iPhone (lưu vào Ảnh / chia sẻ)
    if (navigator.canShare) {
      try {
        const file = new File([blob], filename, { type:'image/png' });
        if (navigator.canShare({ files:[file] })) {
          await navigator.share({ files:[file], title:'Thiệp mời', text: name || '' });
          return 'shared';
        }
      } catch(e){ if (e && e.name === 'AbortError') return 'cancel'; /* lỗi khác -> thử cách dưới */ }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const canDownload = ('download' in a) && !isIOS;

    // 2) Tải thẳng (máy tính / Android)
    if (canDownload) {
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 15000);
      return 'downloaded';
    }

    // 3) Dự phòng cho iPhone: mở ảnh ở tab mới để nhấn giữ -> "Lưu ảnh"
    window.open(url, '_blank');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    return 'opened';
  }

  // Sự kiện
  input.addEventListener('input', draw);
  document.getElementById('plus').addEventListener('click', ()=>{ sizeAdj += 3; draw(); });
  document.getElementById('minus').addEventListener('click', ()=>{ sizeAdj -= 3; draw(); });

  document.getElementById('save').addEventListener('click', async ()=>{
    const name = currentName();
    if (!name){ toast('Vui lòng nhập tên khách mời trước.'); input.focus(); return; }

    // Lưu ảnh TRƯỚC (giữ thao tác chạm cho iPhone), gửi tên vào Sheet sau.
    const r = await saveImage(name);
    if (r === 'opened')        toast('Nhấn giữ vào ảnh rồi chọn "Lưu ảnh" để lưu về máy.');
    else if (r === 'shared')   toast('Chọn "Lưu ảnh" / "Lưu vào Ảnh" trong bảng chia sẻ.');
    else if (r === 'downloaded') toast('Đã tải thiệp về máy ✓');
    else if (r === 'cancel')   { /* người dùng huỷ chia sẻ, không báo gì */ }
    else if (r === 'fail')     { toast('Không tạo được ảnh. Hãy thử lại trên Chrome/Safari.'); return; }

    sendToSheet(name); // gửi nền, không chặn thao tác lưu ảnh
  });

  // Trạng thái cấu hình sheet
  statusEl.innerHTML = SHEET_WEBAPP_URL
    ? 'Tên nhập vào sẽ được lưu vào danh sách chung của chủ tiệc.'
    : '<span class="warn">Chưa cấu hình Google Sheet</span> — trang vẫn tạo &amp; tải thiệp bình thường.';
</script>
